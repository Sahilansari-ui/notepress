name: Autopilot SEO & Sitemap Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    paths:
      - 'generate_seo.py'
      - '.github/workflows/autopilot-seo.yml'

permissions:
  contents: write

jobs:
  build-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEO Autopilot Script
        run: python generate_seo.py

      - name: Commit & Push Generated Pages
        run: |
          git config user.name "NotePress Autopilot Bot"
          git config user.email "actions@github.com"
          git add pages/ sitemap.xml robots.txt
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Autopilot: update 30 SEO pages and sitemap"
            git push
          else
            echo "No changes to commit"
          fi
