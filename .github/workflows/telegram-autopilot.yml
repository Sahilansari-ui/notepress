name: Telegram 3x Daily Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'

jobs:
  post-to-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Autopilot Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_autopost.py
